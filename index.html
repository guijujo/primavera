<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover -> aprovecha la pantalla completa en iPhone (notch) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0d0b" />
  <meta name="description" content="...hecho con mucho amor" />
  <title>Flores amarillas para Naza 🌻</title>

  <!-- Tipografías (si no hay internet, caen a las fuentes del sistema) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ============================================================
       CAPA 1 · Canvas 3D (Three.js). Ocupa toda la pantalla y se
       dibuja con fondo transparente para que se vea el degradado CSS.
       ============================================================ -->
  <canvas id="scene" aria-hidden="true"></canvas>

  <!-- ============================================================
       CAPA 2 · La carta (glassmorphism) superpuesta al canvas
       ============================================================ -->
  <main class="card" id="card" role="article" aria-label="Carta para Naza">
    <p class="card__eyebrow">21 de septiembre · Primer día de primavera</p>
    <h1 class="card__title">Para vos, Naza</h1>
    <div class="card__rule" aria-hidden="true"><span></span>🌻<span></span></div>

    <!-- El texto se escribe acá, letra por letra, desde script.js -->
    <div class="letter" id="letter" aria-live="polite"></div>

    <p class="card__sign" id="sign">Con todo mi amor,<br /><strong>Guille</strong></p>
    <p class="card__hint" id="hint">toca la carta para leerla completa</p>
  </main>

  <!-- ============================================================
       CAPA 3 · Pantalla de bienvenida (dispara audio + florecimiento)
       ============================================================ -->
  <div class="welcome" id="welcome">
    <div class="welcome__inner">
      <p class="welcome__pre">Hay algo esperándote acá adentro…</p>
      <h2 class="welcome__title">Feliz primavera,<br />Naza</h2>
      <button class="btn-open" id="btn-open" type="button">
        <span class="btn-open__glow" aria-hidden="true"></span>
        <span class="btn-open__label">Abrir regalo</span>
      </button>
      <p class="welcome__note">🔊 con sonido, si podés</p>
    </div>
  </div>

  <!-- ============================================================
       CAPA 4 · Clave de 4 dígitos. La carta no se muestra hasta
       ingresarla. El código se cambia en script.js → CONFIG.clave
       ============================================================ -->
  <div class="lock" id="lock" aria-hidden="true">
    <div class="lock__panel" id="lock-panel" role="dialog" aria-modal="true" aria-label="Clave para abrir la carta">
      <p class="lock__pre">🔒 Esta carta es solo para vos</p>
      <h2 class="lock__title">Ingresá la clave</h2>

      <div class="lock__dots" id="lock-dots" aria-hidden="true"></div>
      <p class="lock__msg" id="lock-msg" role="status">&nbsp;</p>

      <div class="keypad" id="keypad">
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <span aria-hidden="true"></span>
        <button type="button" data-key="0">0</button>
        <button type="button" data-key="del" class="keypad__del" aria-label="Borrar">&#9003;</button>
      </div>
    </div>
  </div>

  <!-- Botón flotante Play/Pausa (visible siempre) -->
  <button class="btn-audio" id="btn-audio" type="button" aria-label="Pausar música" title="Música">
    <svg class="icon icon--pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="3.6" height="14" rx="1.3"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.3"/></svg>
    <svg class="icon icon--play"  viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.3v13.4c0 .9 1 1.5 1.8 1l10.4-6.7c.7-.5.7-1.5 0-2L9.8 4.3C9 3.8 8 4.4 8 5.3z"/></svg>
  </button>

  <!-- Avisos discretos (por ejemplo, si falta musica.mp3) -->
  <div class="toast" id="toast" role="status"></div>

  <!-- ============================================================
       AUDIO · "musica.mp3" tiene que estar junto a este index.html.
       autoplay: intenta sonar sola al entrar. Si el navegador lo
       bloquea (pasa casi siempre en celulares), script.js la arranca
       con el primer toque en cualquier parte de la pantalla.
       ============================================================ -->
  <audio id="bgm" src="musica.mp3" loop autoplay preload="auto"></audio>

  <!-- ============================================================
       LIBRERÍA 3D · Three.js desde CDN (build clásico: funciona
       incluso abriendo el index.html con doble clic, sin servidor).
       ============================================================ -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
  <script>
    // Respaldo: si jsDelivr no responde, cargamos Three.js desde cdnjs.
    if (!window.THREE) {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');
    }
  </script>

  <script src="script.js"></script>
</body>
</html>
